<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>QR Message</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>📨 Message</h1>

<p class="subtitle">

The sender has shared the following message with you.

</p>

<div id="messageBox">

Loading message...

</div>

<button id="replyBtn">

Reply on WhatsApp

</button>

</div>

<script>

const MY_PHONE = "919620742098";

/*
Replace the above number with your own.

Format:

CountryCode + Number

Example

919876543210

No +

No spaces
*/

const params = new URLSearchParams(window.location.search);

const msg = params.get("msg");

if(msg && msg.trim()!==""){

document.getElementById("messageBox").innerText = msg;

}
else{

document.getElementById("messageBox").innerText =
"No message was found.";

}

document
.getElementById("replyBtn")
.addEventListener("click",function(){

const reply =

"Hi Nagesh,\n\n" +

"Regarding your message:\n\n" +

"\"" +

msg +

"\"\n\n" +

"My reply is:\n";

window.location.href =

"https://wa.me/"

+

MY_PHONE

+

"?text="

+

encodeURIComponent(reply);

});

</script>

</body>

</html>
